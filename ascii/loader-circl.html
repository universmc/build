<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supperposition scss affichage.html de l'interface graphique de $Response()</title>
    <style>
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #222222;
            padding: 10px 20px;
        }

        .top-bar .logo {
            color: #00FFC2;
            font-size: 2rem;
            font-weight: bold;
        }

        .top-bar .menu {
            display: flex;
            align-items: center;
        }

        .top-bar .menu a {
            color: #999999;
            font-size: 1.2rem;
            text-decoration: none;
            padding: 0 10px;
            transition: all 0.3s ease;
        }

        .top-bar .menu a:hover {
            color: #FFFFFF;
        }

        .top-bar .menu .separator {
            margin: 0 10px;
        }

        .main-content {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 100px);
        }

        .main-content .spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100px;
            height: 100px;
            border: 5px solid #00FFC2;
            border-top: 5px solid #222222;
            border-radius: 50%;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="logo">[:📡/<]</div>
        <div class="menu">
            <a href="#">💫</a>
            <span class="separator">|</span>
            <a href="#">💻</a>
            <span class="separator">|</span>
            <a href="#">📱</a>
            <span class="separator">|</span>
            <a href="#">💬</a>
            <span class="separator">|</span>
            <a href="#">🔷</a>
            <span class="separator">|</span>
            <a href="#">🧾</a>
            <span class="separator">|</span>
            <a href="#">💳</a>
            <span class="separator">|</span>
            <a href="#">💾</a>
            <span class="separator">|</span>
            <a href="#">🛰</a>
        </div>
    </div>
    <div class="main-content">
        <div class="spinner"></div>
    </div>
</body>
</html>
