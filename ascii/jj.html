<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Réponse</title>
    <style>
      .response-container {
        border: 1px solid #ccc;
        padding: 20px;
        margin-bottom: 20px;
        border-radius: 4px;
      
        &:last-child {
          margin-bottom: 0;
        }
      
        > p {
          margin-bottom: 10px;
        }
      
        > h3 {
          margin-top: 0;
          margin-bottom: 5px;
        }
      
        > ul {
          list-style-type: none;
          padding: 0;
          margin: 0;
      
          > li {
            margin-bottom: 5px;
      
            &:last-child {
              margin-bottom: 0;
            }
          }
        }
      
        .highlight {
          background-color: #ff0;
          padding: 2px 4px;
          border-radius: 4px;
        }
      }
      </style>
    <style>
      /* Ajoute ici les styles SCSS pour la présentation de la réponse */
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Réponse</h1>
      </header>
      <main>
        <div class="response-container">
          <!-- Affiche ici le contenu de la réponse -->
          <div class="response-container">
            <h3>[$Response()]</h3>
            <p>
              <img src="data:image/png;base64,iVBORw0KGg...." alt="Bandeau de réponse" />
            </p>
            <ul>
              <li>
                <span class="highlight">💫</span> Opération de superposition de la réponse :
                <span class="highlight">scss() affichage.html</span> de l'interface graphique de
                <span class="highlight">$Response()</span>
              </li>
            </ul>
          </div>
        </div>
      </main>
      <footer>
        <!-- Ajoute ici les informations de pied de page -->
      </footer>
    </div>
  </body>
</html>
